<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>登录 - 校园二手交易平台</title>
<link rel="stylesheet" href="common.css">
<style>
.auth-page {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  background: var(--color-surface);
}

/* 顶部 Logo 区 */
.auth-header {
  text-align: center;
  padding: 60px 24px 32px;
}
.auth-logo {
  width: 72px;
  height: 72px;
  background: linear-gradient(135deg, var(--color-primary), var(--color-accent));
  border-radius: var(--radius-lg);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 32px;
  margin-bottom: var(--space-lg);
  box-shadow: 0 4px 16px rgba(255,107,53,0.3);
}
.auth-title {
  font-size: var(--font-size-xl);
  font-weight: 800;
  color: var(--color-text-primary);
}
.auth-subtitle {
  font-size: var(--font-size-sm);
  color: var(--color-text-tertiary);
  margin-top: var(--space-xs);
}

/* Tab 切换 */
.auth-tabs {
  display: flex;
  margin: 0 24px;
  border-bottom: 2px solid var(--color-border);
}
.auth-tab {
  flex: 1;
  text-align: center;
  padding: 12px 0;
  font-weight: 600;
  font-size: var(--font-size-base);
  color: var(--color-text-tertiary);
  cursor: pointer;
  position: relative;
  transition: color 0.2s;
}
.auth-tab.active {
  color: var(--color-primary);
}
.auth-tab.active::after {
  content: '';
  position: absolute;
  bottom: -2px;
  left: 50%;
  transform: translateX(-50%);
  width: 40px;
  height: 3px;
  background: var(--color-primary);
  border-radius: 2px;
}

/* 表单区 */
.auth-form {
  padding: 32px 24px 0;
  flex: 1;
}
.auth-form.hidden {
  display: none;
}

.auth-form .form-group {
  margin-bottom: 20px;
}

.auth-form .form-input {
  background: var(--color-bg);
  border-color: transparent;
  padding: 14px 16px;
}
.auth-form .form-input:focus {
  background: var(--color-surface);
  border-color: var(--color-primary);
}

/* 验证码输入行 */
.input-with-btn {
  display: flex;
  gap: var(--space-sm);
}
.input-with-btn .form-input {
  flex: 1;
}
.input-with-btn .btn {
  flex-shrink: 0;
  padding: 0 16px;
  font-size: var(--font-size-xs);
}

/* 提交按钮 */
.auth-submit {
  margin-top: 12px;
  padding: 14px;
  font-size: var(--font-size-base);
  font-weight: 700;
  border-radius: var(--radius-md);
}

/* 协议 */
.auth-agreement {
  text-align: center;
  font-size: var(--font-size-xs);
  color: var(--color-text-tertiary);
  padding: 20px 0 40px;
}
.auth-agreement a {
  color: var(--color-primary);
}

/* 错误提示 */
.auth-error {
  font-size: var(--font-size-xs);
  color: var(--color-danger);
  margin-top: -12px;
  margin-bottom: 16px;
  display: none;
}
.auth-error.show {
  display: block;
}
</style>
</head>
<body>
<div class="auth-page">

  <!-- 头部 Logo -->
  <div class="auth-header">
    <div class="auth-logo"><i class="icon" data-icon="book" style="width:36px;height:36px"></i></div>
    <div class="auth-title">校园二手</div>
    <div class="auth-subtitle">安全 · 便捷 · 校园专属交易平台</div>
  </div>

  <!-- Tab 切换 -->
  <div class="auth-tabs">
    <div class="auth-tab active" data-tab="login">登录</div>
    <div class="auth-tab" data-tab="register">注册</div>
  </div>

  <!-- 错误提示 -->
  <div class="auth-error" id="authError"></div>

  <!-- 登录表单 -->
  <form class="auth-form" id="loginForm" autocomplete="off">
    <div class="form-group">
      <input class="form-input" type="text" id="loginAccount" placeholder="手机号 / 学号" autocomplete="username" required>
    </div>
    <div class="form-group">
      <input class="form-input" type="password" id="loginPassword" placeholder="密码" autocomplete="current-password" required>
    </div>
    <button class="btn btn-primary btn-block auth-submit" type="submit" id="loginBtn">
      登录
    </button>
    <div class="auth-agreement">
      登录即表示同意 <a href="#">《用户协议》</a> 和 <a href="#">《隐私政策》</a>
    </div>
  </form>

  <!-- 注册表单 -->
  <form class="auth-form hidden" id="registerForm" autocomplete="off">
    <div class="form-group">
      <input class="form-input" type="tel" id="regPhone" placeholder="手机号" maxlength="11" required>
    </div>
    <div class="form-group">
      <input class="form-input" type="text" id="regStudentId" placeholder="学号（选填）" maxlength="12">
    </div>
    <div class="form-group">
      <input class="form-input" type="text" id="regNickname" placeholder="昵称" maxlength="20" required>
    </div>
    <div class="form-group">
      <input class="form-input" type="password" id="regPassword" placeholder="密码（6-20位，需包含字母和数字）" minlength="6" maxlength="20" required>
    </div>
    <div class="form-group">
      <input class="form-input" type="password" id="regConfirmPwd" placeholder="确认密码" required>
    </div>
    <button class="btn btn-primary btn-block auth-submit" type="submit" id="registerBtn">
      注册
    </button>
    <div class="auth-agreement">
      注册即表示同意 <a href="#">《用户协议》</a> 和 <a href="#">《隐私政策》</a>
    </div>
  </form>

</div>

<!-- 全局 Toast -->
<div class="toast toast-global"></div>

<script src="api.js"></script>
<script src="icons.js"></script>
<script>
(function() {
  // === Tab 切换 ===
  var tabs = document.querySelectorAll('.auth-tab');
  var loginForm = document.getElementById('loginForm');
  var registerForm = document.getElementById('registerForm');
  var authError = document.getElementById('authError');

  tabs.forEach(function(tab) {
    tab.addEventListener('click', function() {
      tabs.forEach(function(t) { t.classList.remove('active'); });
      tab.classList.add('active');
      authError.classList.remove('show');

      if (tab.dataset.tab === 'login') {
        loginForm.classList.remove('hidden');
        registerForm.classList.add('hidden');
      } else {
        loginForm.classList.add('hidden');
        registerForm.classList.remove('hidden');
      }
    });
  });

  // === 登录处理 ===
  loginForm.addEventListener('submit', async function(e) {
    e.preventDefault();
    authError.classList.remove('show');
    var account = document.getElementById('loginAccount').value.trim();
    var password = document.getElementById('loginPassword').value;

    if (!account || !password) {
      authError.textContent = '请填写账号和密码';
      authError.classList.add('show');
      return;
    }

    var btn = document.getElementById('loginBtn');
    btn.disabled = true;
    btn.textContent = '登录中...';

    try {
      var data = await post('/user/login', { account: account, password: password });
      // 保存登录态
      setLogin(data.token, {
        userId: data.userId,
        nickname: data.nickname,
        avatar: data.avatar,
        role: data.role,
        creditScore: data.creditScore
      });

      showToast('登录成功');

      // 跳转
      var redirect = getQueryParam('redirect');
      setTimeout(function() {
        if (data.role === 1) {
          window.location.href = redirect || 'index.html';
        } else {
          window.location.href = redirect || 'index.html';
        }
      }, 500);
    } catch (err) {
      authError.textContent = err.msg || '登录失败，请重试';
      authError.classList.add('show');
    } finally {
      btn.disabled = false;
      btn.textContent = '登录';
    }
  });

  // === 注册处理 ===
  registerForm.addEventListener('submit', async function(e) {
    e.preventDefault();
    authError.classList.remove('show');

    var phone = document.getElementById('regPhone').value.trim();
    var studentId = document.getElementById('regStudentId').value.trim();
    var nickname = document.getElementById('regNickname').value.trim();
    var password = document.getElementById('regPassword').value;
    var confirmPwd = document.getElementById('regConfirmPwd').value;

    // 校验
    if (!phone || !/^1[3-9]\d{9}$/.test(phone)) {
      authError.textContent = '请输入正确的手机号';
      authError.classList.add('show');
      return;
    }
    if (!nickname) {
      authError.textContent = '请填写昵称';
      authError.classList.add('show');
      return;
    }
    if (password.length < 6) {
      authError.textContent = '密码长度至少6位';
      authError.classList.add('show');
      return;
    }
    if (password !== confirmPwd) {
      authError.textContent = '两次密码输入不一致';
      authError.classList.add('show');
      return;
    }

    var btn = document.getElementById('registerBtn');
    btn.disabled = true;
    btn.textContent = '注册中...';

    try {
      var data = await post('/user/register', {
        phone: phone,
        studentId: studentId || undefined,
        nickname: nickname,
        password: password
      });

      showToast('注册成功，请登录');

      // 切换到登录 Tab，填充手机号
      setTimeout(function() {
        tabs.forEach(function(t) { t.classList.remove('active'); });
        tabs[0].classList.add('active');
        loginForm.classList.remove('hidden');
        registerForm.classList.add('hidden');
        document.getElementById('loginAccount').value = phone;
        document.getElementById('loginPassword').value = '';
        registerForm.reset();
      }, 1000);
    } catch (err) {
      authError.textContent = err.msg || '注册失败，请重试';
      authError.classList.add('show');
    } finally {
      btn.disabled = false;
      btn.textContent = '注册';
    }
  });

  // === 工具 ===
  function getQueryParam(name) {
    var match = window.location.search.match(new RegExp('[?&]' + name + '=([^&]*)'));
    return match ? decodeURIComponent(match[1]) : null;
  }

  // 如果已有登录态，自动跳转
  if (isLoggedIn()) {
    var redirect = getQueryParam('redirect');
    window.location.href = redirect || 'index.html';
  }
})();
</script>
</body>
</html>
