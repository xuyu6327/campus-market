<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>校园二手交易平台</title>
<link rel="stylesheet" href="common.css">
<style>
/* ============================================================
   首页专用样式
   ============================================================ */

/* --- Header --- */
.home-header {
  display: flex;
  align-items: center;
  gap: var(--space-md);
  padding: var(--space-sm) var(--space-lg);
  background: var(--color-surface);
  position: sticky;
  top: 0;
  z-index: 100;
  border-bottom: 1px solid var(--color-border);
}
.home-logo {
  font-weight: 800;
  font-size: var(--font-size-lg);
  color: var(--color-text-primary);
  white-space: nowrap;
  letter-spacing: -0.5px;
}
.home-logo .logo-accent { color: var(--color-primary); }
.home-search {
  flex: 1;
  display: flex;
  align-items: center;
  gap: 6px;
  background: var(--color-surface-alt);
  border-radius: var(--radius-full);
  padding: 9px 16px;
  cursor: pointer;
  transition: background 0.2s;
}
.home-search:hover { background: var(--color-border); }
.home-search .icon { font-size: 15px; }
.home-search .placeholder {
  font-size: var(--font-size-sm);
  color: var(--color-text-tertiary);
}
.home-actions {
  display: flex;
  align-items: center;
  gap: var(--space-sm);
}
.home-actions .btn-login {
  font-size: var(--font-size-sm);
  font-weight: 600;
  color: var(--color-primary);
  padding: 6px 14px;
  border-radius: var(--radius-full);
  border: 1.5px solid var(--color-primary);
}
.home-actions .btn-login:hover { background: var(--color-primary-light); }
.home-avatar {
  width: 34px;
  height: 34px;
  border-radius: 50%;
  object-fit: cover;
  border: 2px solid var(--color-border);
  cursor: pointer;
}
.home-avatar-default {
  width: 34px;
  height: 34px;
  border-radius: 50%;
  background: var(--color-primary-light);
  color: var(--color-primary);
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 700;
  font-size: var(--font-size-sm);
  cursor: pointer;
}

/* --- Search Bar (fullscreen) --- */
.search-overlay {
  position: fixed;
  inset: 0;
  background: var(--color-surface);
  z-index: 200;
  display: none;
  flex-direction: column;
}
.search-overlay.show { display: flex; }
.search-bar {
  display: flex;
  align-items: center;
  gap: var(--space-sm);
  padding: var(--space-md) var(--space-lg);
  border-bottom: 1px solid var(--color-border);
}
.search-bar input {
  flex: 1;
  border: none;
  outline: none;
  font-size: var(--font-size-base);
  padding: 10px 0;
}
.search-bar .search-cancel {
  font-size: var(--font-size-sm);
  color: var(--color-text-secondary);
  white-space: nowrap;
}
.search-hot {
  padding: var(--space-lg);
}
.search-hot h4 {
  font-size: var(--font-size-sm);
  color: var(--color-text-secondary);
  margin-bottom: var(--space-md);
}
.search-hot-tags {
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-sm);
}
.search-hot-tag {
  padding: 6px 14px;
  background: var(--color-surface-alt);
  border-radius: var(--radius-full);
  font-size: var(--font-size-sm);
  color: var(--color-text-secondary);
}

/* --- Category Tabs --- */
.cat-bar {
  display: flex;
  align-items: center;
  gap: var(--space-sm);
  padding: var(--space-md) var(--space-lg);
  overflow-x: auto;
  scrollbar-width: none;
  -webkit-overflow-scrolling: touch;
  background: var(--color-surface);
  border-bottom: 1px solid var(--color-border);
}
.cat-bar::-webkit-scrollbar { display: none; }
.cat-item {
  flex-shrink: 0;
  padding: 6px 16px;
  border-radius: var(--radius-full);
  font-size: var(--font-size-sm);
  font-weight: 600;
  color: var(--color-text-secondary);
  white-space: nowrap;
  cursor: pointer;
  transition: all 0.2s;
}
.cat-item:hover { background: var(--color-surface-alt); }
.cat-item.active {
  background: var(--color-primary);
  color: var(--color-text-inverse);
}

/* --- Sort Bar --- */
.sort-bar {
  display: flex;
  align-items: center;
  gap: var(--space-sm);
  padding: var(--space-sm) var(--space-lg);
  background: var(--color-surface);
  border-bottom: 1px solid var(--color-border);
  overflow-x: auto;
  scrollbar-width: none;
}
.sort-bar::-webkit-scrollbar { display: none; }
.sort-item {
  flex-shrink: 0;
  padding: 5px 12px;
  font-size: var(--font-size-xs);
  font-weight: 600;
  color: var(--color-text-tertiary);
  cursor: pointer;
  border-radius: var(--radius-sm);
  transition: all 0.2s;
}
.sort-item:hover { color: var(--color-text-secondary); }
.sort-item.active { color: var(--color-primary); background: var(--color-primary-light); }

.price-filter {
  display: flex;
  align-items: center;
  gap: 4px;
}
.price-filter input {
  width: 56px;
  padding: 4px 8px;
  border: 1px solid var(--color-border);
  border-radius: var(--radius-sm);
  font-size: var(--font-size-xs);
  text-align: center;
  outline: none;
}
.price-filter input:focus { border-color: var(--color-primary); }
.price-filter span { font-size: var(--font-size-xs); color: var(--color-text-tertiary); }
.price-filter .btn {
  font-size: var(--font-size-xs);
  padding: 4px 10px;
}

/* --- Product Grid --- */
.product-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: var(--space-md);
  padding: var(--space-md) var(--space-lg);
}

.product-card {
  background: var(--color-surface);
  border-radius: var(--radius-md);
  overflow: hidden;
  box-shadow: var(--shadow-sm);
  cursor: pointer;
  transition: box-shadow 0.2s, transform 0.2s;
}
.product-card:hover {
  box-shadow: var(--shadow-md);
  transform: translateY(-2px);
}

.product-card-img {
  width: 100%;
  aspect-ratio: 1;
  background: var(--color-surface-alt);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 40px;
  position: relative;
  overflow: hidden;
}
.product-card-img img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}
.product-card-img .placeholder-icon {
  width: 44px;
  height: 44px;
  opacity: 0.25;
  color: var(--color-text-tertiary);
}

.product-card-tags {
  position: absolute;
  top: 8px;
  left: 8px;
  display: flex;
  gap: 4px;
  flex-wrap: wrap;
}
.product-card-tag {
  padding: 2px 8px;
  border-radius: var(--radius-full);
  font-size: 10px;
  font-weight: 700;
  color: #fff;
}
.product-card-tag.status-booked { background: var(--color-warning); }
.product-card-tag.status-sold { background: var(--color-text-tertiary); }
.product-card-tag.condition {
  background: rgba(0,0,0,0.55);
}

.product-card-body {
  padding: 10px 12px 12px;
}

.product-card-price {
  font-size: var(--font-size-lg);
  font-weight: 800;
  color: var(--color-primary);
}
.product-card-price .currency { font-size: var(--font-size-xs); }
.product-card-price .original {
  font-size: var(--font-size-xs);
  font-weight: 400;
  color: var(--color-text-tertiary);
  text-decoration: line-through;
  margin-left: 6px;
}

.product-card-title {
  font-size: var(--font-size-sm);
  color: var(--color-text-primary);
  margin-top: 4px;
  line-height: 1.4;
  overflow: hidden;
  text-overflow: ellipsis;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
}

.product-card-meta {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-top: 8px;
  font-size: var(--font-size-xs);
  color: var(--color-text-tertiary);
}
.product-card-meta .left {
  display: flex;
  align-items: center;
  gap: 4px;
}
.product-card-meta .dot {
  width: 3px;
  height: 3px;
  border-radius: 50%;
  background: var(--color-text-tertiary);
}

/* --- Bottom Tab Bar --- */
.tab-bar {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  display: flex;
  align-items: flex-start;
  justify-content: space-around;
  padding: 10px 0 env(safe-area-inset-bottom, 12px);
  background: var(--color-surface);
  border-top: 1px solid var(--color-border);
  z-index: 100;
}
.tab-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  font-size: 10px;
  font-weight: 600;
  color: var(--color-text-tertiary);
  cursor: pointer;
  padding: 4px 14px;
  min-width: 60px;
  transition: color 0.2s;
}
.tab-item.active { color: var(--color-primary); }
.tab-item .tab-icon { font-size: 22px; line-height: 1.2; }
.tab-item .tab-label { font-size: 10px; }

.tab-publish {
  position: relative;
}
.tab-publish-btn {
  width: 52px;
  height: 52px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--color-primary), #FF8F5E);
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 28px;
  line-height: 1;
  margin-top: -24px;
  box-shadow: 0 4px 16px rgba(255,107,53,0.45);
  cursor: pointer;
  transition: transform 0.2s;
}
.tab-publish-btn:hover { transform: scale(1.08); }

.tab-item .badge {
  position: absolute;
  top: -4px;
  right: -8px;
  min-width: 16px;
  height: 16px;
  font-size: 9px;
  padding: 0 4px;
}

/* --- Load More --- */
.load-more {
  text-align: center;
  padding: var(--space-xl) var(--space-lg) 100px;
  font-size: var(--font-size-sm);
  color: var(--color-text-tertiary);
}
.load-more .loading { padding: var(--space-md); }

/* --- Back to Top --- */
.back-top {
  position: fixed;
  bottom: 90px;
  right: 20px;
  width: 44px;
  height: 44px;
  border-radius: 50%;
  background: var(--color-surface);
  box-shadow: var(--shadow-lg);
  display: none;
  align-items: center;
  justify-content: center;
  font-size: 20px;
  cursor: pointer;
  z-index: 50;
  transition: transform 0.2s;
}
.back-top.show { display: flex; }
.back-top:hover { transform: scale(1.1); }

/* --- Condition filter dropdown --- */
.filter-dropdown {
  position: relative;
}
.filter-dropdown-menu {
  position: absolute;
  top: 100%;
  left: 0;
  background: var(--color-surface);
  border-radius: var(--radius-md);
  box-shadow: var(--shadow-lg);
  padding: var(--space-sm);
  min-width: 140px;
  z-index: 50;
  display: none;
}
.filter-dropdown-menu.show { display: block; }
.filter-dropdown-item {
  padding: 8px 14px;
  font-size: var(--font-size-sm);
  color: var(--color-text-secondary);
  cursor: pointer;
  border-radius: var(--radius-sm);
  transition: background 0.15s;
}
.filter-dropdown-item:hover { background: var(--color-surface-alt); }
.filter-dropdown-item.active { color: var(--color-primary); font-weight: 600; }
</style>
</head>
<body>

<!-- ===== 顶部导航 ===== -->
<div class="home-header">
  <div class="home-logo">校园<span class="logo-accent">二手</span></div>
  <div class="home-search" id="searchTrigger">
    <i class="icon" data-icon="search"></i>
    <span class="placeholder">搜索你想要的闲置...</span>
  </div>
  <div class="home-actions" id="headerActions">
    <!-- 由 JS 动态渲染 -->
  </div>
</div>

<!-- ===== 搜索浮层 ===== -->
<div class="search-overlay" id="searchOverlay">
  <div class="search-bar">
    <input type="text" id="searchInput" placeholder="搜索商品名称..." autocomplete="off">
    <button class="search-cancel" id="searchCancel">取消</button>
  </div>
  <div class="search-hot" id="searchHot">
    <h4>热门搜索</h4>
    <div class="search-hot-tags" id="hotTags"></div>
  </div>
</div>

<!-- ===== 分类 Tabs ===== -->
<div class="cat-bar" id="catBar">
  <!-- 由 JS 动态渲染 -->
</div>

<!-- ===== 排序栏 ===== -->
<div class="sort-bar" id="sortBar">
  <span class="sort-item active" data-sort="newest">最新</span>
  <span class="sort-item" data-sort="price_asc">价格↑</span>
  <span class="sort-item" data-sort="price_desc">价格↓</span>
  <span class="sort-item" data-sort="popular">热门</span>
  <div class="filter-dropdown">
    <span class="sort-item" id="conditionFilter">成色 ▾</span>
    <div class="filter-dropdown-menu" id="conditionMenu">
      <div class="filter-dropdown-item" data-value="">全部</div>
      <div class="filter-dropdown-item" data-value="1">全新未拆</div>
      <div class="filter-dropdown-item" data-value="2">几乎全新</div>
      <div class="filter-dropdown-item" data-value="3">轻微使用痕迹</div>
      <div class="filter-dropdown-item" data-value="4">明显使用痕迹</div>
      <div class="filter-dropdown-item" data-value="5">故障/坏件</div>
    </div>
  </div>
  <div class="price-filter">
    <input type="number" id="priceMin" placeholder="¥最低" min="0">
    <span>—</span>
    <input type="number" id="priceMax" placeholder="¥最高" min="0">
    <button class="btn btn-sm btn-outline" id="priceFilterBtn">确定</button>
  </div>
</div>

<!-- ===== 商品列表 ===== -->
<div class="page">
  <div class="product-grid" id="productGrid">
    <!-- 由 JS 动态渲染 -->
  </div>
  <div class="load-more" id="loadMore">
    <span id="loadMoreText">上拉加载更多</span>
  </div>
</div>

<!-- ===== 底部导航 ===== -->
<div class="tab-bar">
  <div class="tab-item active" data-page="home">
    <span class="tab-icon"><i class="icon" data-icon="home"></i></span>
    <span class="tab-label">首页</span>
  </div>
  <div class="tab-item" data-page="messages">
    <span class="tab-icon" style="position:relative;"><i class="icon" data-icon="message"></i><span class="badge" id="msgBadge" style="display:none">0</span></span>
    <span class="tab-label">消息</span>
  </div>
  <div class="tab-item tab-publish" data-page="publish">
    <div class="tab-publish-btn"><i class="icon" data-icon="add"></i></div>
  </div>
  <div class="tab-item" data-page="profile">
    <span class="tab-icon"><i class="icon" data-icon="user"></i></span>
    <span class="tab-label">我的</span>
  </div>
  <div class="tab-item" data-page="favorites">
    <span class="tab-icon"><i class="icon" data-icon="heart"></i></span>
    <span class="tab-label">收藏</span>
  </div>
</div>

<!-- ===== 回到顶部 ===== -->
<div class="back-top" id="backTop"><i class="icon" data-icon="chevron-right" style="transform:rotate(-90deg)"></i></div>

<!-- ===== 全局 Toast ===== -->
<div class="toast toast-global"></div>

<script src="api.js"></script>
<script src="icons.js"></script>
<script>
(function() {
  // ==================== 状态 ====================
  var state = {
    pageNum: 1,
    pageSize: 10,
    hasMore: true,
    loading: false,
    categoryId: null,      // 分类筛选
    keyword: '',
    sortBy: 'newest',
    goodsCondition: '',
    minPrice: '',
    maxPrice: '',
    goodsList: [],
    categories: []
  };

  // DOM 缓存
  var grid = document.getElementById('productGrid');
  var loadMoreEl = document.getElementById('loadMore');
  var loadMoreText = document.getElementById('loadMoreText');
  var catBar = document.getElementById('catBar');
  var sortItems = document.querySelectorAll('.sort-item[data-sort]');

  // ==================== 初始化 ====================
  init();

  function init() {loadMsgBadge();
    renderHeader();
    loadCategories();
    loadGoods(true);

    // 监听滚动
    window.addEventListener('scroll', onScroll);
    document.getElementById('backTop').addEventListener('click', function() {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });

    // 搜索
    document.getElementById('searchTrigger').addEventListener('click', openSearch);
    document.getElementById('searchCancel').addEventListener('click', closeSearch);
    document.getElementById('searchInput').addEventListener('keydown', function(e) {
      if (e.key === 'Enter') doSearch(this.value.trim());
    });

    // 排序
    sortItems.forEach(function(el) {
      el.addEventListener('click', function() {
        sortItems.forEach(function(s) { s.classList.remove('active'); });
        el.classList.add('active');
        state.sortBy = el.dataset.sort;
        resetList();
        loadGoods();
      });
    });

    // 成色筛选（菜单用 fixed 定位，避免被 sort-bar 的 overflow 裁剪）
    document.getElementById('conditionFilter').addEventListener('click', function(e) {
      e.stopPropagation();
      var menu = document.getElementById('conditionMenu');
      var rect = this.getBoundingClientRect();
      menu.style.position = 'fixed';
      menu.style.top = (rect.bottom + 4) + 'px';
      menu.style.left = rect.left + 'px';
      menu.classList.toggle('show');
    });
    document.querySelectorAll('#conditionMenu .filter-dropdown-item').forEach(function(item) {
      item.addEventListener('click', function() {
        document.querySelectorAll('#conditionMenu .filter-dropdown-item').forEach(function(i) { i.classList.remove('active'); });
        item.classList.add('active');
        document.getElementById('conditionMenu').classList.remove('show');
        state.goodsCondition = item.dataset.value;
        // 更新筛选按钮文字
        if (state.goodsCondition) {
          document.getElementById('conditionFilter').textContent = CONDITION_MAP[state.goodsCondition] + ' ▾';
        } else {
          document.getElementById('conditionFilter').textContent = '成色 ▾';
        }
        resetList();
        loadGoods();
      });
    });
    document.addEventListener('click', function() {
      document.getElementById('conditionMenu').classList.remove('show');
    });
    window.addEventListener('scroll', function() {
      document.getElementById('conditionMenu').classList.remove('show');
    });

    // 价格筛选
    document.getElementById('priceFilterBtn').addEventListener('click', function() {
      state.minPrice = document.getElementById('priceMin').value;
      state.maxPrice = document.getElementById('priceMax').value;
      resetList();
      loadGoods();
    });

    // 底部导航点击
    document.querySelectorAll('.tab-item').forEach(function(item) {
      item.addEventListener('click', function() {
        var page = item.dataset.page;
        if (page === 'publish') {
          if (!requireAuth()) return;
          window.location.href = 'publish.html';
        } else if (page === 'messages') {
          if (!requireAuth()) return;
          window.location.href = 'notifications.html';
        } else if (page === 'profile') {
          if (!requireAuth()) return;
          window.location.href = 'profile.html';
        } else if (page === 'favorites') {
          if (!requireAuth()) return;
          window.location.href = 'favorites.html';
        }
      });
    });
  }

  // ==================== 渲染顶部导航用户状态 ====================
  function renderHeader() {
    var container = document.getElementById('headerActions');
    var user = getCurrentUser();
    if (user) {
      if (user.avatar) {
        container.innerHTML = '<img class="home-avatar" src="' + user.avatar + '" alt="avatar" onclick="location.href=\'profile.html\'">';
      } else {
        // 旧登录态可能缺 avatar：拉取最新用户信息补齐（头像更换后首页也能同步）
        get('/user/info', {}, { noToast: true }).then(function(u) {
          if (u && u.avatar) {
            localStorage.setItem('user', JSON.stringify(Object.assign({}, user, u)));
            container.innerHTML = '<img class="home-avatar" src="' + u.avatar + '" alt="avatar" onclick="location.href=\'profile.html\'">';
          } else {
            container.innerHTML = '<div class="home-avatar-default" onclick="location.href=\'profile.html\'">' + (user.nickname ? user.nickname.charAt(0) : '我') + '</div>';
          }
        }).catch(function() {
          container.innerHTML = '<div class="home-avatar-default" onclick="location.href=\'profile.html\'">' + (user.nickname ? user.nickname.charAt(0) : '我') + '</div>';
        });
      }
    } else {
      container.innerHTML = '<a class="btn-login" href="auth.html">登录</a>';
    }
  }

  // ==================== 分类 ====================
  function loadCategories() {
    get('/goods/category', {}, { noAuth: true, noToast: true })
      .then(function(list) {
        state.categories = list || [];
        renderCategories();
      })
      .catch(function() {});
  }

  function renderCategories() {
    var html = '<span class="cat-item active" data-cat="">全部</span>';
    (state.categories || []).forEach(function(cat) {
      if (cat.parentId === 0) { // 只显示一级分类
        html += '<span class="cat-item" data-cat="' + cat.id + '">' + cat.name + '</span>';
      }
    });
    catBar.innerHTML = html;

    // 分类点击
    catBar.querySelectorAll('.cat-item').forEach(function(el) {
      el.addEventListener('click', function() {
        catBar.querySelectorAll('.cat-item').forEach(function(c) { c.classList.remove('active'); });
        el.classList.add('active');
        state.categoryId = el.dataset.cat || null;
        resetList();
        loadGoods();
      });
    });
  }

  // ==================== 商品列表 ====================
  function loadGoods(reset) {
    if (state.loading || (!state.hasMore && !reset)) return;
    state.loading = true;

    if (reset) {
      state.pageNum = 1;
      state.hasMore = true;
      loadMoreText.textContent = '加载中...';
    }

    var params = {
      pageNum: state.pageNum,
      pageSize: state.pageSize,
      sortBy: state.sortBy
    };
    if (state.categoryId) params.categoryId = state.categoryId;
    if (state.goodsCondition) params.goodsCondition = state.goodsCondition;
    if (state.minPrice) params.minPrice = state.minPrice;
    if (state.maxPrice) params.maxPrice = state.maxPrice;

    var url = '/goods/list';
    if (state.keyword) {
      // 统一走 /goods/list：该接口已支持 keyword + 排序/价格/成色筛选
      params.keyword = state.keyword;
    }

    get(url, params, { noToast: true })
      .then(function(page) {
        if (!page) {
          state.hasMore = false;
          loadMoreText.textContent = '暂无数据';
          state.loading = false;
          if (reset) renderGoods([]);
          return;
        }

        var records = page.records || [];
        if (reset) {
          state.goodsList = records;
        } else {
          state.goodsList = state.goodsList.concat(records);
        }

        renderGoods(state.goodsList);

        state.hasMore = records.length >= state.pageSize;
        state.pageNum++;

        if (state.hasMore) {
          loadMoreText.textContent = '上拉加载更多';
        } else {
          loadMoreText.textContent = state.goodsList.length > 0 ? '— 没有更多了 —' : '暂无商品';
        }
        state.loading = false;
      })
      .catch(function() {
        state.loading = false;
        loadMoreText.textContent = '加载失败，请下拉重试';
      });
  }

  function renderGoods(list) {
    if (!list || list.length === 0) {
      grid.innerHTML = '<div class="empty-state"><i class="icon" data-icon="box" style="width:48px;height:48px;opacity:0.3;margin-bottom:14px;color:var(--color-text-tertiary)"></i><p>暂无商品，来看看其他分类吧</p></div>';
      return;
    }

    var html = '';
    list.forEach(function(g) {
      var conditionName = CONDITION_MAP[g.goodsCondition] || '';
      var statusTag = '';
      if (g.status === 2) statusTag = '<span class="product-card-tag status-booked">已预订</span>';
      else if (g.status === 3) statusTag = '<span class="product-card-tag status-sold">已售出</span>';

      var imgHtml;
      if (g.coverImage) {
        imgHtml = '<img src="' + g.coverImage + '" alt="' + escapeHtml(g.title) + '" loading="lazy">';
      } else {
        imgHtml = '<i class="icon placeholder-icon" data-icon="camera"></i>';
      }

      var originalPriceHtml = '';
      if (g.originalPrice && g.originalPrice > 0) {
        originalPriceHtml = '<span class="original">¥' + g.originalPrice + '</span>';
      }

      html += '<div class="product-card" data-id="' + g.id + '">'
        + '<div class="product-card-img">'
        + imgHtml
        + '<div class="product-card-tags">'
        + (statusTag || '<span class="product-card-tag condition">' + escapeHtml(conditionName) + '</span>')
        + '</div></div>'
        + '<div class="product-card-body">'
        + '<div class="product-card-price"><span class="currency">¥</span>' + Number(g.price).toFixed(0) + originalPriceHtml + '</div>'
        + '<div class="product-card-title">' + escapeHtml(g.title) + '</div>'
        + '<div class="product-card-meta">'
        + '<div class="left">' + escapeHtml(g.tradeLocation || '校内') + '<span class="dot"></span>' + timeAgo(g.createTime) + '</div>'
        + '<span>' + (g.viewCount || 0) + '次浏览</span>'
        + '</div></div></div>';
    });
    grid.innerHTML = html;

    // 点击商品卡片跳转详情
    grid.querySelectorAll('.product-card').forEach(function(card) {
      card.addEventListener('click', function() {
        window.location.href = 'detail.html?id=' + this.dataset.id;
      });
    });
  }

  // ==================== 搜索 ====================
  function openSearch() {
    document.getElementById('searchOverlay').classList.add('show');
    document.getElementById('searchInput').focus();
    loadHotSearches();
  }

  function closeSearch() {
    document.getElementById('searchOverlay').classList.remove('show');
    document.getElementById('searchInput').value = '';
  }

  function doSearch(keyword) {
    if (!keyword) return;
    state.keyword = keyword;
    state.categoryId = null;
    catBar.querySelectorAll('.cat-item').forEach(function(c) { c.classList.remove('active'); });
    catBar.querySelector('.cat-item[data-cat=""]').classList.add('active');
    closeSearch();
    resetList();
    loadGoods();
  }

  function loadHotSearches() {
    // 热门搜索词硬编码（后续可对接接口）
    var hotTags = ['教材', '考研资料', '手机', '自行车', '台灯', '耳机', '四六级'];
    var container = document.getElementById('hotTags');
    container.innerHTML = hotTags.map(function(w) {
      return '<span class="search-hot-tag" data-word="' + w + '">' + w + '</span>';
    }).join('');
    container.querySelectorAll('.search-hot-tag').forEach(function(el) {
      el.addEventListener('click', function() {
        doSearch(this.dataset.word);
      });
    });
  }

  // ==================== 滚动加载 ====================
  function onScroll() {
    // 回到顶部按钮
    var backTop = document.getElementById('backTop');
    if (window.scrollY > 600) {
      backTop.classList.add('show');
    } else {
      backTop.classList.remove('show');
    }

    // 触底加载更多
    if (state.loading || !state.hasMore) return;
    var scrollHeight = document.documentElement.scrollHeight;
    var scrollTop = window.scrollY || document.documentElement.scrollTop;
    var clientHeight = document.documentElement.clientHeight;
    if (scrollHeight - scrollTop - clientHeight < 200) {
      loadGoods();
    }
  }

  // ==================== 工具 ====================
  function resetList() {
    state.pageNum = 1;
    state.hasMore = true;
    state.goodsList = [];
    grid.innerHTML = '';
    loadMoreText.textContent = '加载中...';
  }

  function loadMsgBadge(){if(!isLoggedIn())return;
    var total=0,left=2;
    function done(){var b=document.getElementById('msgBadge');if(total>0){b.textContent=total;b.style.display='flex';}else{b.style.display='none';}}
    get('/notification/unread-count',{},{noToast:true}).then(function(n){total+=(n||0);if(--left===0)done();}).catch(function(){if(--left===0)done();});
    get('/chat/unread-count',{},{noToast:true}).then(function(n){total+=(n||0);if(--left===0)done();}).catch(function(){if(--left===0)done();});}
  // 浏览器往返缓存（bfcache）恢复时页面 JS 不会重新执行，需在 pageshow 时刷新角标
  window.addEventListener('pageshow',function(e){if(e.persisted)loadMsgBadge();});
  function escapeHtml(text) {
    if (!text) return '';
    var div = document.createElement('div');
    div.appendChild(document.createTextNode(text));
    return div.innerHTML;
  }

})();
</script>
</body>
</html>
