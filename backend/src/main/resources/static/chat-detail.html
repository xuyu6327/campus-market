<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>聊天 - 校园二手交易平台</title><link rel="stylesheet" href="common.css">
<style>
.chat-page{background:var(--color-bg);height:100vh;display:flex;flex-direction:column;}
.chat-body{flex:1;overflow-y:auto;padding:var(--space-md) 14px;background:var(--color-bg);}
.chat-date{text-align:center;font-size:11px;color:var(--color-text-tertiary);margin:6px 0 14px;}
.msg-row{display:flex;gap:10px;margin-bottom:14px;align-items:flex-end;}
.msg-row.mine{flex-direction:row-reverse;}
.msg-avatar{width:34px;height:34px;border-radius:50%;background:var(--color-primary-light);color:var(--color-primary);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex-shrink:0;overflow:hidden;}
.msg-avatar img{width:100%;height:100%;object-fit:cover;}
.msg-wrap{max-width:70%;display:flex;flex-direction:column;}
.msg-bubble{padding:10px 14px;border-radius:16px;font-size:var(--font-size-sm);line-height:1.5;word-break:break-word;}
.msg-row.them .msg-bubble{background:var(--color-surface);color:var(--color-text-primary);border-top-left-radius:4px;box-shadow:var(--shadow-sm);}
.msg-row.mine .msg-bubble{background:var(--color-primary);color:#fff;border-top-right-radius:4px;}
.msg-time{font-size:10px;color:var(--color-text-tertiary);margin-top:4px;}
.msg-row.mine .msg-time{text-align:right;}
.chat-input-bar{display:flex;gap:8px;padding:10px 12px calc(env(safe-area-inset-bottom)+10px);background:var(--color-surface);border-top:1px solid var(--color-border);flex-shrink:0;}
.chat-input-bar input{flex:1;padding:10px 14px;border:1.5px solid var(--color-border);border-radius:999px;outline:none;font-size:var(--font-size-sm);background:var(--color-bg);}
.chat-input-bar input:focus{border-color:var(--color-primary);}
.chat-input-bar .send{padding:10px 22px;border:none;border-radius:999px;background:var(--color-primary);color:#fff;font-size:var(--font-size-sm);font-weight:600;cursor:pointer;}
</style>
</head>
<body>
<div class="chat-page">
  <div class="page-header"><span class="page-header-back" onclick="history.back()">←</span><span class="page-header-title" id="chatTitle">聊天</span><a class="page-header-home" href="index.html"><i class="icon" data-icon="home"></i></a></div>
  <div class="chat-body" id="chatBody"><div class="loading" style="padding:60px">加载中...</div></div>
  <div class="chat-input-bar">
    <input type="text" id="chatInput" placeholder="输入消息..." maxlength="500">
    <button class="send" id="sendBtn">发送</button>
  </div>
</div>
<div class="toast toast-global"></div>
<script src="api.js"></script>
<script src="icons.js"></script>
<script>
(function(){
  if(!requireAuth())return;
  function escapeHtml(t){if(t===null||t===undefined)return'';return String(t).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
  function getQueryParam(name){var m=window.location.search.match(new RegExp('[?&]'+name+'=([^&]*)'));return m?decodeURIComponent(m[1]):null;}
  var convId=getQueryParam('id');
  if(!convId){document.getElementById('chatBody').innerHTML='<div class="empty-state"><p>缺少会话ID</p></div>';return;}
  var lastId=0;      // 已加载的最后一条消息ID（轮询增量基准）
  var loaded=false;
  var input=document.getElementById('chatInput');
  var otherAvatar=null,otherNickname='';
  var me=getCurrentUser()||{};

  // 会话信息：对方昵称/头像
  get('/chat/'+convId+'/info',{},{noToast:true}).then(function(info){
    if(info){
      otherAvatar=info.otherAvatar||null;
      otherNickname=info.otherNickname||'聊天';
      document.getElementById('chatTitle').textContent=otherNickname;
      refreshAvatars();
    }
  }).catch(function(){});

  loadInitial();
  // 首载：最近50条
  function loadInitial(){
    get('/chat/'+convId+'/messages',{},{noToast:true}).then(function(list){
      list=list||[];
      var body=document.getElementById('chatBody');
      body.innerHTML=list.map(function(m){return msgHtml(m);}).join('');
      loaded=true;
      scrollBottom();
    }).catch(function(err){
      document.getElementById('chatBody').innerHTML='<div class="empty-state"><p>'+escapeHtml(err.msg||'加载失败')+'</p></div>';
    });
  }
  // 轮询增量：5秒一次
  setInterval(function(){
    if(!loaded)return;
    get('/chat/'+convId+'/messages',{afterId:lastId},{noToast:true}).then(function(list){
      if(!list||list.length===0)return;
      var body=document.getElementById('chatBody');
      var atBottom=body.scrollHeight-body.scrollTop-body.clientHeight<80;
      list.forEach(function(m){body.innerHTML+=msgHtml(m);});
      if(atBottom)scrollBottom();
    }).catch(function(){});
  },5000);
  // 发送
  function send(){
    var text=input.value.trim();
    if(!text)return;
    post('/chat/'+convId+'/messages',{content:text}).then(function(){
      input.value='';
      // 立即补一条本地消息，并刷新 lastId
      get('/chat/'+convId+'/messages',{afterId:lastId},{noToast:true}).then(function(list){
        if(list&&list.length>0){
          var body=document.getElementById('chatBody');
          list.forEach(function(m){body.innerHTML+=msgHtml(m);});
          scrollBottom();
        }
      });
    }).catch(function(err){showToast(err.msg||'发送失败');});
  }
  function msgHtml(m){
    if(m.id>lastId)lastId=m.id;
    var mine=m.senderId===me.userId;
    var time=formatTime(m.createTime);
    var cls=mine?'mine':'them';
    var avatar=mine?avatarHtml(me.avatar,'我'):avatarHtml(otherAvatar,otherNickname.charAt(0)||'?');
    return '<div class="msg-row '+cls+'">'+avatar+'<div class="msg-wrap"><div class="msg-bubble">'+escapeHtml(m.content)+'</div><div class="msg-time">'+time+'</div></div></div>';
  }
  function avatarHtml(url,fallback){
    if(url)return '<div class="msg-avatar"><img src="'+url+'" alt=""></div>';
    return '<div class="msg-avatar">'+escapeHtml(fallback)+'</div>';
  }
  function refreshAvatars(){
    var rows=document.querySelectorAll('.msg-row .msg-avatar');
    rows.forEach(function(el){
      var row=el.parentElement;
      var mine=row.classList.contains('mine');
      var url=mine?(me.avatar||''):(otherAvatar||'');
      if(url)el.innerHTML='<img src="'+url+'" alt="">';
    });
  }
  function formatTime(t){
    var d=new Date(t),now=new Date();
    var hm=d.getHours()+':'+String(d.getMinutes()).padStart(2,'0');
    if(d.toDateString()===now.toDateString())return hm;
    var yest=new Date(now);yest.setDate(now.getDate()-1);
    if(d.toDateString()===yest.toDateString())return '昨天 '+hm;
    return (d.getMonth()+1)+'月'+d.getDate()+'日 '+hm;
  }
  function scrollBottom(){
    var body=document.getElementById('chatBody');
    body.scrollTop=body.scrollHeight;
  }
  document.getElementById('sendBtn').addEventListener('click',send);
  input.addEventListener('keydown',function(e){if(e.key==='Enter')send();});
})();
</script>
</body>
</html>
