<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>我的 - 校园二手交易平台</title>
<link rel="stylesheet" href="common.css">
<style>
.profile-page { background: var(--color-bg); min-height: 100vh; padding-bottom: 120px; }

/* 用户信息头 */
.profile-header {
  background: linear-gradient(135deg, var(--color-primary), #FF8F5E);
  padding: 16px var(--space-xl) 32px;
  color: #fff;
  position: relative;
}
/* 顶部导航条 */
.profile-nav {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 24px;
}
.profile-nav .nav-back {
  font-size: 20px;
  padding: 6px 10px;
  border-radius: var(--radius-full);
  background: rgba(255,255,255,0.15);
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 6px;
  color: #fff;
  text-decoration: none;
  font-size: var(--font-size-sm);
  font-weight: 600;
}
.profile-nav .nav-back:hover { background: rgba(255,255,255,0.25); }
.profile-nav .nav-title {
  font-weight: 700;
  font-size: var(--font-size-base);
}
.profile-nav .nav-right {
  display: flex;
  align-items: center;
  gap: 8px;
}
.profile-nav .nav-home {
  padding: 6px 14px;
  border-radius: var(--radius-full);
  background: rgba(255,255,255,0.15);
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 4px;
  color: #fff;
  text-decoration: none;
  font-size: var(--font-size-xs);
  font-weight: 600;
}
.profile-nav .nav-home:hover { background: rgba(255,255,255,0.25); }
.profile-nav .nav-edit {
  padding: 6px 12px;
  border-radius: var(--radius-full);
  background: rgba(255,255,255,0.2);
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 4px;
  color: #fff;
  font-size: var(--font-size-xs);
  font-weight: 600;
}
.profile-nav .nav-edit:hover { background: rgba(255,255,255,0.3); }
.profile-user {
  display: flex;
  align-items: center;
  gap: var(--space-lg);
}
.profile-avatar {
  width: 72px;
  height: 72px;
  border-radius: 50%;
  background: rgba(255,255,255,0.2);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 32px;
  font-weight: 700;
  flex-shrink: 0;
  overflow: hidden;
  border: 3px solid rgba(255,255,255,0.3);
}
.profile-avatar img { width: 100%; height: 100%; object-fit: cover; }
.profile-info { flex: 1; min-width: 0; }
.profile-nickname {
  font-size: var(--font-size-xl);
  font-weight: 800;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.profile-phone {
  font-size: var(--font-size-sm);
  opacity: 0.85;
  margin-top: 4px;
}
.profile-edit-btn {
  position: absolute;
  top: var(--space-lg);
  right: var(--space-lg);
  font-size: var(--font-size-sm);
  opacity: 0.9;
  padding: 6px 14px;
  border-radius: var(--radius-full);
  background: rgba(255,255,255,0.2);
  cursor: pointer;
}
.profile-edit-btn:hover { background: rgba(255,255,255,0.3); }

/* 信用分区 */
.credit-card {
  margin: 4px var(--space-lg) 28px;
  background: var(--color-surface);
  border-radius: var(--radius-lg);
  padding: 20px var(--space-lg);
  box-shadow: 0 2px 12px rgba(26,26,46,0.06);
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.credit-left { display: flex; align-items: center; gap: var(--space-lg); }
.credit-score-circle {
  width: 52px;
  height: 52px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--color-accent), var(--color-primary));
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.credit-score-circle span {
  color: #fff;
  font-size: var(--font-size-lg);
  font-weight: 800;
}
.credit-info h4 { font-size: var(--font-size-base); font-weight: 700; }
.credit-info p { font-size: var(--font-size-xs); color: var(--color-text-tertiary); margin-top: 2px; }
.credit-arrow { color: var(--color-text-tertiary); font-size: 18px; cursor: pointer; }

/* 菜单列表 */
.menu-section {
  margin: 0 var(--space-lg) 24px;
  background: var(--color-surface);
  border-radius: var(--radius-lg);
  overflow: hidden;
  box-shadow: var(--shadow-sm);
}
.menu-section:first-of-type { margin-top: var(--space-lg); }
.menu-item {
  display: flex;
  align-items: center;
  gap: var(--space-lg);
  padding: 18px var(--space-lg);
  border-bottom: 1px solid var(--color-border);
  cursor: pointer;
  transition: background 0.15s;
}
.menu-item:last-child { border-bottom: none; }
.menu-item:hover { background: var(--color-surface-alt); }
.menu-icon {
  width: 36px;
  height: 36px;
  border-radius: var(--radius-sm);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
  flex-shrink: 0;
}
.menu-icon.green { background: var(--color-secondary-light); }
.menu-icon.orange { background: var(--color-primary-light); }
.menu-icon.blue { background: var(--color-info-light); }
.menu-icon.red { background: var(--color-danger-light); }
.menu-icon.purple { background: #F3E8FF; }
.menu-icon.yellow { background: var(--color-warning-light); }

.menu-label { flex: 1; font-size: var(--font-size-base); font-weight: 600; }
.menu-badge {
  font-size: var(--font-size-xs);
  color: var(--color-text-tertiary);
  display: flex;
  align-items: center;
  gap: 6px;
}
.menu-badge .num {
  background: var(--color-danger);
  color: #fff;
  padding: 1px 7px;
  border-radius: var(--radius-full);
  font-size: 10px;
  font-weight: 700;
  min-width: 18px;
  text-align: center;
}
.menu-arrow { color: var(--color-border-strong); font-size: 16px; }

/* 退出按钮 */
.logout-btn {
  margin: 24px var(--space-lg);
  text-align: center;
  padding: 14px;
  border-radius: var(--radius-md);
  background: var(--color-surface);
  color: var(--color-danger);
  font-weight: 600;
  font-size: var(--font-size-sm);
  cursor: pointer;
  box-shadow: var(--shadow-sm);
  transition: background 0.15s;
}
.logout-btn:hover { background: var(--color-danger-light); }

/* 管理员入口 */
.admin-entry {
  margin: 0 var(--space-lg) 24px;
  padding: 16px var(--space-lg);
  background: var(--color-warning-light);
  border-radius: var(--radius-lg);
  display: flex;
  align-items: center;
  justify-content: space-between;
  cursor: pointer;
  font-size: var(--font-size-sm);
  font-weight: 600;
  color: var(--color-warning);
}
.admin-entry .arrow { font-size: 16px; }

/* 编辑资料弹窗 */
.edit-modal .form-group { margin-bottom: 16px; }
.edit-modal .form-group:last-child { margin-bottom: 0; }
.edit-modal .form-input { background: var(--color-bg); border-color: transparent; }
.edit-modal .form-input:focus { background: var(--color-surface); border-color: var(--color-primary); }
.edit-avatar {
  width: 72px;
  height: 72px;
  margin: 0 auto 8px;
  border-radius: 50%;
  background: var(--color-surface-alt);
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  cursor: pointer;
  border: 2px dashed var(--color-border);
  color: var(--color-text-tertiary);
  transition: border-color 0.2s;
}
.edit-avatar:hover { border-color: var(--color-primary); }
.edit-avatar img { width: 100%; height: 100%; object-fit: cover; }
.avatar-hint { font-size: var(--font-size-xs); color: var(--color-text-tertiary); text-align: center; margin-bottom: 16px; }
</style>
</head>
<body>
<div class="profile-page">

  <!-- 用户信息头 -->
  <div class="profile-header">
    <!-- 顶部导航条 -->
    <div class="profile-nav">
      <span class="nav-back" onclick="history.back()">← 返回</span>
      <span class="nav-title">个人中心</span>
      <div class="nav-right">
        <a class="nav-home" href="index.html"><i class="icon" data-icon="home"></i> 首页</a>
        <span class="nav-edit" id="editProfileBtn"><i class="icon" data-icon="edit"></i> 编辑</span>
      </div>
    </div>
    <!-- 用户信息 -->
    <div class="profile-user">
      <div class="profile-avatar" id="avatarEl">?</div>
      <div class="profile-info">
        <div class="profile-nickname" id="nicknameEl">未登录</div>
        <div class="profile-phone" id="phoneEl">-</div>
      </div>
    </div>
  </div>

  <!-- 信用分卡片 -->
  <div class="credit-card" id="creditCard">
    <div class="credit-left">
      <div class="credit-score-circle"><span id="creditScore">-</span></div>
      <div class="credit-info">
        <h4>信用分</h4>
        <p id="creditDesc">初始信用分 100</p>
      </div>
    </div>
    <span class="credit-arrow" id="creditLogBtn" onclick="viewCreditLogs()">›</span>
  </div>

  <!-- 管理员入口（仅管理员可见） -->
  <div class="admin-entry" id="adminEntry" style="display:none" onclick="location.href='admin/index.html'">
    <span><i class="icon" data-icon="settings"></i> 进入后台管理</span>
    <span class="arrow">›</span>
  </div>

  <!-- 菜单列表 -->
  <div class="menu-section">
    <div class="menu-item" onclick="location.href='my-goods.html'">
      <span class="menu-icon green"><i class="icon" data-icon="box"></i></span>
      <span class="menu-label">我的发布</span>
      <span class="menu-arrow">›</span>
    </div>
    <div class="menu-item" onclick="location.href='favorites.html'">
      <span class="menu-icon orange"><i class="icon" data-icon="heart"></i></span>
      <span class="menu-label">我的收藏</span>
      <span class="menu-arrow">›</span>
    </div>
    <div class="menu-item" onclick="location.href='history.html'">
      <span class="menu-icon blue"><i class="icon" data-icon="clock"></i></span>
      <span class="menu-label">浏览记录</span>
      <span class="menu-arrow">›</span>
    </div>
  </div>

  <div class="menu-section">
    <div class="menu-item" onclick="location.href='orders.html'">
      <span class="menu-icon purple"><i class="icon" data-icon="doc"></i></span>
      <span class="menu-label">我的订单</span>
      <span class="menu-arrow">›</span>
    </div>
    <div class="menu-item" onclick="location.href='notifications.html'">
      <span class="menu-icon red"><i class="icon" data-icon="bell"></i></span>
      <span class="menu-label">消息通知</span>
      <span class="menu-badge"><span class="num" id="unreadBadge" style="display:none">0</span></span>
      <span class="menu-arrow">›</span>
    </div>
    <div class="menu-item" onclick="location.href='reviews.html'">
      <span class="menu-icon yellow"><i class="icon" data-icon="star"></i></span>
      <span class="menu-label">我的评价</span>
      <span class="menu-arrow">›</span>
    </div>
  </div>

  <div class="menu-section">
    <div class="menu-item" id="editInfoBtn">
      <span class="menu-icon blue"><i class="icon" data-icon="user"></i></span>
      <span class="menu-label">账号设置</span>
      <span class="menu-arrow">›</span>
    </div>
    <div class="menu-item" onclick="viewCreditLogs()">
      <span class="menu-icon green"><i class="icon" data-icon="chart"></i></span>
      <span class="menu-label">信用分记录</span>
      <span class="menu-arrow">›</span>
    </div>
  </div>

  <div class="logout-btn" id="logoutBtn" onclick="doLogout()">退出登录</div>

</div>

<!-- 编辑资料弹窗 -->
<div class="modal-overlay" id="editModal">
  <div class="modal-content edit-modal">
    <div class="modal-header">
      <span>编辑资料</span>
      <span class="modal-close" onclick="closeEdit()">×</span>
    </div>
    <div class="edit-avatar" id="editAvatarEl" onclick="document.getElementById('avatarInput').click()">
      <i class="icon" data-icon="camera" style="width:30px;height:30px;opacity:0.4"></i>
    </div>
    <p class="avatar-hint">点击更换头像</p>
    <input type="file" id="avatarInput" accept="image/jpeg,image/png,image/gif,image/webp" style="display:none">
    <div class="form-group">
      <input class="form-input" id="editNickname" placeholder="昵称" maxlength="20">
    </div>
    <div class="form-group">
      <input class="form-input" id="editPhone" placeholder="手机号" maxlength="11" readonly style="background:var(--color-surface-alt);color:var(--color-text-tertiary)">
    </div>
    <div class="form-group">
      <input class="form-input" id="editStudentId" placeholder="学号" maxlength="12">
    </div>
    <div class="form-group">
      <input class="form-input" id="editRealName" placeholder="真实姓名" maxlength="20">
    </div>
    <div class="form-group">
      <input class="form-input" id="editWechat" placeholder="微信号" maxlength="20">
    </div>
    <div class="form-group">
      <input class="form-input" id="editQq" placeholder="QQ号" maxlength="20">
    </div>
    <button class="btn btn-primary btn-block" onclick="saveProfile()">保存</button>
  </div>
</div>

<div class="toast toast-global"></div>

<script src="api.js"></script>
<script src="icons.js"></script>
<script>
(function() {
  // 未登录跳转
  if (!requireAuth()) return;

  var userData = null;
  var pendingAvatar = null;

  // === 加载用户信息 ===
  loadProfile();
  loadUnreadCount();
  // 浏览器往返缓存（bfcache）恢复时页面 JS 不会重新执行，需在 pageshow 时刷新未读角标
  window.addEventListener('pageshow',function(e){if(e.persisted)loadUnreadCount();});

  function loadProfile() {
    get('/user/info')
      .then(function(data) {
        userData = data;
        renderProfile(data);
      })
      .catch(function(err) {
        showToast(err.msg || '加载失败');
      });
  }

  function renderProfile(u) {
    // 头像
    var avatarEl = document.getElementById('avatarEl');
    if (u.avatar) {
      avatarEl.innerHTML = '<img src="' + u.avatar + '" alt="avatar">';
    } else {
      avatarEl.textContent = u.nickname ? u.nickname.charAt(0) : '?';
    }
    // 昵称
    document.getElementById('nicknameEl').textContent = u.nickname || '未设置';
    // 手机号
    document.getElementById('phoneEl').textContent = u.phone || '-';
    // 信用分
    document.getElementById('creditScore').textContent = u.creditScore != null ? u.creditScore : '-';
    var score = u.creditScore || 0;
    if (score >= 150) document.getElementById('creditDesc').textContent = '信用优秀 ★';
    else if (score >= 100) document.getElementById('creditDesc').textContent = '信用良好';
    else if (score >= 50) document.getElementById('creditDesc').textContent = '信用一般';
    else document.getElementById('creditDesc').textContent = '信用较低，注意履约';

    // 管理员入口
    if (u.role === 1) {
      document.getElementById('adminEntry').style.display = 'flex';
    }
  }

  // === 未读数（通知 + 私聊） ===
  function loadUnreadCount() {
    var total = 0, left = 2;
    function done() {
      var badge = document.getElementById('unreadBadge');
      if (total > 0) { badge.textContent = total; badge.style.display = 'inline'; }
      else { badge.style.display = 'none'; }
    }
    get('/notification/unread-count', {}, { noToast: true })
      .then(function(n) { total += (n || 0); if (--left === 0) done(); })
      .catch(function() { if (--left === 0) done(); });
    get('/chat/unread-count', {}, { noToast: true })
      .then(function(n) { total += (n || 0); if (--left === 0) done(); })
      .catch(function() { if (--left === 0) done(); });
  }

  // === 编辑资料 ===
  window.openEdit = function() {
    if (!userData) return;
    document.getElementById('editNickname').value = userData.nickname || '';
    document.getElementById('editPhone').value = userData.phone || '';
    document.getElementById('editStudentId').value = userData.studentId || '';
    document.getElementById('editRealName').value = userData.realName || '';
    document.getElementById('editWechat').value = userData.wechat || '';
    document.getElementById('editQq').value = userData.qq || '';
    pendingAvatar = null;
    var avatarBox = document.getElementById('editAvatarEl');
    if (userData.avatar) {
      avatarBox.innerHTML = '<img src="' + userData.avatar + '" alt="avatar">';
    } else {
      avatarBox.innerHTML = '<i class="icon" data-icon="camera" style="width:30px;height:30px;opacity:0.4"></i>';
    }
    document.getElementById('editModal').classList.add('show');
  };

  // === 头像上传 ===
  document.getElementById('avatarInput').addEventListener('change', function() {
    var file = this.files[0];
    if (!file) return;
    uploadFile(file)
      .then(function(url) {
        pendingAvatar = url;
        document.getElementById('editAvatarEl').innerHTML = '<img src="' + url + '" alt="avatar">';
        showToast('头像已选择，保存后生效');
      })
      .catch(function(err) { showToast(err.msg || '上传失败'); });
    this.value = '';
  });
  document.getElementById('editProfileBtn').addEventListener('click', function() { window.openEdit(); });
  document.getElementById('editInfoBtn').addEventListener('click', function() { window.openEdit(); });

  window.closeEdit = function() {
    document.getElementById('editModal').classList.remove('show');
  };

  window.saveProfile = function() {
    var data = {};
    var nickname = document.getElementById('editNickname').value.trim();
    var studentId = document.getElementById('editStudentId').value.trim();
    var realName = document.getElementById('editRealName').value.trim();
    var wechat = document.getElementById('editWechat').value.trim();
    var qq = document.getElementById('editQq').value.trim();

    if (nickname && nickname !== userData.nickname) data.nickname = nickname;
    if (studentId && studentId !== userData.studentId) data.studentId = studentId;
    if (realName && realName !== userData.realName) data.realName = realName;
    if (wechat && wechat !== userData.wechat) data.wechat = wechat;
    if (qq && qq !== userData.qq) data.qq = qq;
    if (pendingAvatar) data.avatar = pendingAvatar;

    if (Object.keys(data).length === 0) { closeEdit(); return; }

    put('/user/info', data)
      .then(function() {
        showToast('保存成功');
        closeEdit();
        loadProfile(); // 刷新
      })
      .catch(function(err) {
        showToast(err.msg || '保存失败');
      });
  };

  // === 信用分记录 ===
  window.viewCreditLogs = function() {
    window.location.href = 'credit-logs.html';
  };

  // === 退出登录 ===
  window.doLogout = function() {
    if (!confirm('确定退出登录吗？')) return;
    localStorage.removeItem('token');
    localStorage.removeItem('user');
    window.location.href = 'auth.html';
  };

})();
</script>
</body>
</html>
