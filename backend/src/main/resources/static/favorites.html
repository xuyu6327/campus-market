<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>我的收藏 - 校园二手交易平台</title><link rel="stylesheet" href="common.css">
<style>
.fav-page { background:var(--color-bg); min-height:100vh; padding-bottom:40px; }
.goods-list { padding:var(--space-md); }
.fav-item { display:flex; gap:var(--space-md); background:var(--color-surface); border-radius:var(--radius-md); padding:10px; margin-bottom:var(--space-sm); cursor:pointer; box-shadow:var(--shadow-sm); }
.fav-item:active { background:var(--color-surface-alt); }
.fav-img { width:76px; height:76px; border-radius:var(--radius-sm); background:var(--color-surface-alt); flex-shrink:0; overflow:hidden; position:relative; display:flex; align-items:center; justify-content:center; font-size:24px; }
.fav-img img { width:100%; height:100%; object-fit:cover; }
.fav-img .status-overlay { position:absolute; inset:0; background:rgba(0,0,0,0.45); display:flex; align-items:center; justify-content:center; color:#fff; font-weight:700; font-size:11px; }
.fav-info { flex:1; min-width:0; display:flex; flex-direction:column; justify-content:space-between; padding:2px 0; }
.fav-title { font-size:var(--font-size-sm); font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.fav-price { font-size:var(--font-size-base); font-weight:700; color:var(--color-primary); }
.fav-meta { font-size:var(--font-size-xs); color:var(--color-text-tertiary); }

</style>
</head>
<body>
<div class="fav-page">
  <div class="page-header"><span class="page-header-back" onclick="history.back()">←</span><span class="page-header-title">我的收藏</span><a class="page-header-home" href="index.html"><i class="icon" data-icon="home"></i></a></div>
  <div class="goods-list" id="favList"><div class="loading" style="grid-column:1/-1">加载中...</div></div>
</div>
<div class="toast toast-global"></div>
<script src="api.js"></script>
<script src="icons.js"></script>
<script>
(function(){
  if(!requireAuth())return;
  var pageNum=1,hasMore=true,loading=false;
  function load(reset){
    if(loading||!hasMore)return;
    loading=true;
    if(reset)document.getElementById('favList').innerHTML='<div class="loading" style="grid-column:1/-1">加载中...</div>';
    get('/goods/favorites',{pageNum:pageNum,pageSize:10})
      .then(function(page){
        loading=false;
        var list=page.records||[];
        var el=document.getElementById('favList');
        if(reset){
          if(list.length===0){el.innerHTML='<div class="empty-state" style="grid-column:1/-1"><i class="empty-icon" data-icon="heart"></i><p>暂无收藏</p></div>';return;}
          el.innerHTML=list.map(function(g){return card(g);}).join('');
        }else{list.forEach(function(g){el.innerHTML+=card(g);});}
        hasMore=list.length>=10;pageNum++;
        el.querySelectorAll('.fav-item').forEach(function(c){c.addEventListener('click',function(){window.location.href='detail.html?id='+this.dataset.id;});});
      })
      .catch(function(){loading=false;document.getElementById('favList').innerHTML='<div class="empty-state" style="grid-column:1/-1"><p>加载失败</p></div>';});
  }
  function card(g){
    var img=g.coverImage?'<img src="'+g.coverImage+'" alt="">':'<i class="ph-icon" data-icon="camera"></i>';
    var overlay='';
    if(g.status!==1) overlay='<div class="status-overlay">'+(g.status===3?'已售出':g.status===2?'已预订':'已下架')+'</div>';
    return '<div class="fav-item" data-id="'+g.id+'"><div class="fav-img">'+img+overlay+'</div><div class="fav-info"><div class="fav-title">'+escapeHtml(g.title||'')+'</div><div class="fav-price">¥'+Number(g.price||0).toFixed(0)+'</div><div class="fav-meta">'+timeAgo(g.createTime)+'</div></div></div>';
  }
  window.addEventListener('scroll',function(){
    if(loading||!hasMore)return;
    var sh=document.documentElement.scrollHeight,st=window.scrollY||document.documentElement.scrollTop,ch=document.documentElement.clientHeight;
    if(sh-st-ch<200)load();
  });
  load(true);
  function escapeHtml(t){if(!t)return'';var d=document.createElement('div');d.appendChild(document.createTextNode(t));return d.innerHTML;}
})();
</script>
</body>
</html>
